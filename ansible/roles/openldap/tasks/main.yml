- name: Check that the admin password is present
  ansible.builtin.assert:
    that:
      - openldap_admin_password | length > 0
      - openldap_deploy_key | length > 0
    fail_msg: >-
      admin_password or deploy_key is missing from OpenBao under
      secret/apps/openldap.
    quiet: true

- name: Create the SSH directory for the deploy key
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the deploy key for cloning the compose repository
  ansible.builtin.copy:
    content: "{{ openldap_deploy_key }}\n"
    dest: /root/.ssh/openldap_deploy_key
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Trust the GitLab host key
  ansible.builtin.known_hosts:
    name: "[{{ hostvars[groups['gitlab_hosts'][0]].ansible_host }}]:2224"
    key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -p 2224 -t ed25519 ' ~ hostvars[groups['gitlab_hosts'][0]].ansible_host) }}"
    path: /root/.ssh/known_hosts

- name: Fetch the compose repository
  ansible.builtin.git:
    repo: "{{ openldap_repo_url }}"
    dest: "{{ openldap_project_dir }}"
    version: "{{ openldap_repo_version }}"
    key_file: /root/.ssh/openldap_deploy_key
    accept_hostkey: true
  notify: "Redeploy openldap after compose changes"

- name: Run the generic compose-app tasks
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: openldap
    compose_app_display_name: OpenLDAP
    compose_app_share_tag: "{{ openldap_share_tag }}"
    compose_app_share_path: "{{ openldap_share_path }}"
    compose_app_project_dir: "{{ openldap_project_dir }}"
    compose_app_env:
      OPENLDAP_DOMAIN: "{{ openldap_domain }}"
      OPENLDAP_ORG: "{{ openldap_org }}"
      OPENLDAP_BASE_DN: "{{ openldap_base_dn }}"
      OPENLDAP_ADMIN_PASSWORD: "{{ openldap_admin_password }}"
