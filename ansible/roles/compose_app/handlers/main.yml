- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Re-applies the compose file. Starts the stack if it is not running.
# Notified as "Apply <app> compose" by the calling role, matching the
# <app>-compose.service unit this role installs.
- name: "Apply gitlab compose"
  ansible.builtin.command: systemctl reload-or-restart gitlab-compose.service
  changed_when: true

- name: "Apply authentik compose"
  ansible.builtin.command: systemctl reload-or-restart authentik-compose.service
  changed_when: true

- name: "Apply openldap compose"
  ansible.builtin.command: systemctl reload-or-restart openldap-compose.service
  changed_when: true
