# Authentik image tag. Bump this to upgrade.
authentik_version: "2026.8.2"

# Site name comes from the untracked .env, so the real domain stays out of the repo.
authentik_hostname: "{{ lookup('ansible.builtin.env', 'AUTHENTIK_HOSTNAME') }}"
authentik_external_url: "https://{{ authentik_hostname }}"
authentik_http_port: 9000
authentik_https_port: 9443

# Persistent data lives on the virtiofs share from the host dataset.
authentik_share_tag: authentik-data
authentik_share_path: /mnt/infra

# The compose file comes from the private self-hosted GitLab, over SSH on 2224.
authentik_repo_url: "ssh://git@{{ hostvars[groups['gitlab_hosts'][0]].ansible_host }}:2224/compose-files/authentik.git"
authentik_repo_version: main
authentik_project_dir: /opt/authentik

# Postgres credentials and the Django secret key, pulled from OpenBao at
# converge time via the ansible AppRole (see group_vars/all.yml).
authentik_vault_secret: >-
  {{ lookup('community.hashi_vault.hashi_vault',
     'secret=secret/data/apps/authentik',
     url=vault_addr, ca_cert=vault_ca_cert, auth_method='approle',
     role_id=vault_role_id, secret_id=vault_secret_id) }}
authentik_postgres_db: "{{ authentik_vault_secret.postgres_db }}"
authentik_postgres_user: "{{ authentik_vault_secret.postgres_user }}"
authentik_postgres_password: "{{ authentik_vault_secret.postgres_password }}"
authentik_secret_key: "{{ authentik_vault_secret.secret_key }}"
authentik_deploy_key: "{{ authentik_vault_secret.deploy_key }}"
