- name: Check that the site settings are present
  ansible.builtin.assert:
    that:
      - gitlab_hostname | length > 0
      - gitlab_ssh_host | length > 0
    fail_msg: >-
      GITLAB_HOSTNAME and GITLAB_SSH_HOST are missing. Add them to the
      untracked .env and run this through just.
    quiet: true

# The compose files come from the public GitHub repo over HTTPS, no
# credentials needed, so a rebuild never needs GitLab itself to clone them.
- name: Fetch the compose repository
  ansible.builtin.git:
    repo: "{{ gitlab_repo_url }}"
    dest: "{{ gitlab_project_dir }}"
    version: "{{ gitlab_repo_version }}"

- name: Read the Authentik OIDC client from OpenBao
  ansible.builtin.set_fact:
    gitlab_authentik: "{{ lookup('community.hashi_vault.hashi_vault',
      'secret=secret/data/apps/gitlab-authentik',
      url=vault_addr,
      auth_method='approle',
      role_id=vault_role_id,
      secret_id=vault_secret_id,
      ca_cert=vault_ca_cert) }}"
  no_log: true

- name: Check that the Authentik OIDC client came back complete
  ansible.builtin.assert:
    that:
      - gitlab_authentik.client_id is defined
      - gitlab_authentik.client_secret is defined
      - gitlab_authentik.issuer is defined
    fail_msg: >-
      OpenBao returned an incomplete secret at secret/apps/gitlab-authentik.
      Expected client_id, client_secret, and issuer.
    quiet: true

- name: Run the generic compose-app tasks
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: gitlab
    compose_app_display_name: GitLab
    compose_app_share_tag: "{{ gitlab_share_tag }}"
    compose_app_share_path: "{{ gitlab_share_path }}"
    compose_app_project_dir: "{{ gitlab_project_dir }}"
    compose_app_env:
      GITLAB_VERSION: "{{ gitlab_version }}"
      GITLAB_HOSTNAME: "{{ gitlab_hostname }}"
      GITLAB_EXTERNAL_URL: "{{ gitlab_external_url }}"
      GITLAB_SSH_HOST: "{{ gitlab_ssh_host }}"
      GITLAB_HTTP_PORT: "{{ gitlab_http_port }}"
      GITLAB_SSH_PORT: "{{ gitlab_ssh_port }}"
      GITLAB_DATA_DIR: "{{ gitlab_share_path }}"
      AUTHENTIK_ISSUER: "{{ gitlab_authentik.issuer }}"
      AUTHENTIK_CLIENT_ID: "{{ gitlab_authentik.client_id }}"
      AUTHENTIK_CLIENT_SECRET: "{{ gitlab_authentik.client_secret }}"
