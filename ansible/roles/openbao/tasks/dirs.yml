- name: Create the data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openbao_data_dir }}", mode: "0700" }
    - { path: "{{ openbao_tls_dir }}", mode: "0750" }
    - { path: "{{ openbao_snapshot_dir }}", mode: "0700" }
