- name: Install the systemd unit
  ansible.builtin.template:
    src: openbao.service.j2
    dest: /etc/systemd/system/openbao.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart openbao

- name: Apply pending handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start OpenBao
  ansible.builtin.systemd:
    name: openbao
    enabled: true
    state: started
