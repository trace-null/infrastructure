- name: Create the mount points
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ openbao_mounts }}"
  loop_control:
    label: "{{ item.path }}"

# nofail keeps the VM booting if a share is missing. The service unit then
# refuses to start, so OpenBao can never write to the VM disk by mistake.
- name: Mount the virtiofs shares
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.tag }}"
    fstype: virtiofs
    opts: defaults,nofail,x-systemd.device-timeout=10s
    state: mounted
  loop: "{{ openbao_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check that each share really is mounted
  ansible.builtin.command: findmnt --noheadings --output FSTYPE {{ item.path | quote }}
  register: openbao_mount_check
  changed_when: false
  failed_when: openbao_mount_check.stdout | trim != 'virtiofs'
  loop: "{{ openbao_mounts }}"
  loop_control:
    label: "{{ item.path }}"
