[defaults]
inventory = inventory
roles_path = roles
forks = 5
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
# accept-new trusts a host the first time and refuses if its key later changes.
# Run `just forget-hosts` before a rebuild so new machines are accepted.
ssh_args = -o UserKnownHostsFile=~/.ssh/infra_known_hosts -o StrictHostKeyChecking=accept-new
