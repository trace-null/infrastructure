# Bootstrap layer: OpenBao, GitLab and the runner. Always run by hand.
- name: OpenBao
  hosts: openbao_hosts
  become: true
  roles:
    - baseline
    - openbao

- name: GitLab
  hosts: gitlab_hosts
  become: true
  roles:
    - baseline
    - gitlab

- name: Authentik
  hosts: authentik_hosts
  become: true
  roles:
    - baseline
    - authentik

- name: OpenLDAP
  hosts: openldap_hosts
  become: true
  roles:
    - role: baseline
      when: openldap_deploy_enabled | default(false)
    - role: openldap
      when: openldap_deploy_enabled | default(false)
